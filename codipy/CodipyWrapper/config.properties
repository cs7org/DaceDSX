# Minimal CoDiPy Wrapper Configuration

[general]
kafkaBroker = localhost:9092
schemaRegistry = http://localhost:8081
logLevel = INFO

[consumption]
consumerTimeout = 1000
maxPollRecords = 100

[synchronization]
syncTimeout = 30000
heartbeatInterval = 5000
enableGUI = false
enableVehicleCaching = true
cacheValidityDuration = 0.1

[kafka]
topicPrefix = provision.simulation
timeTopicPrefix = orchestration.simulation
statusTopicPrefix = orchestration.simulation
maxMessageSize = 1048576
consumerTimeout = 1000
producerTimeout = 1000

[simulation]
defaultVehicleType = DEFAULT_VEHTYPE
defaultDepartTime = now
maxSimulationTime = 86400
stepLengthMS = 1000
defaultObservationRadius = 100.0
maxObservedEntities = 1000

[coSimulation]
syncedParticipants = 2
timeAdvancePolicy = conservative
maxWaitTime = 30000
vehicleSchemaPath = ../AvroSchemas/vehicle.avsc
simulationSchemaPath = ../AvroSchemas/simulation.avsc
networkSchemaPath = ../AvroSchemas/network.avsc
