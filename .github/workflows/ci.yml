name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: JavaBaseWrapper (test + install, SimService depends on it)
        run: mvn -B install
        working-directory: JavaBaseWrapper
      - name: SimService
        run: mvn -B test
        working-directory: SimService

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest

  pypsa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: PyPSAWrapper/requirements-local.txt
      - run: pip install -r requirements-test.txt -r PyPSAWrapper/requirements-local.txt
      - run: pytest PyPSAWrapper/tests

  opendss:
    # OpenDSSDirect.py is Linux/x86_64 only in practice (crashes on macOS arm64).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: OpenDSSWrapper/requirements.txt
      - run: pip install -r requirements-test.txt -r OpenDSSWrapper/requirements.txt
      - run: pytest OpenDSSWrapper/tests/test_opendss.py
